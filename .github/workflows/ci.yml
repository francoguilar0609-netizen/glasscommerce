name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify Drizzle migrations are synchronized
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle
          test -z "$(git status --porcelain --untracked-files=all drizzle)"

      - name: Test application, migrations, and payment races
        run: npm test

      - name: Validate artifact
        run: npm run validate:artifact

